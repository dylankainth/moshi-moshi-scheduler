services:
  app:
    build: ../..
    restart: unless-stopped
    environment:
      FORESIGHT_TOKEN: ${FORESIGHT_TOKEN:-}
      VULTR_INFERENCE_KEY: ${VULTR_INFERENCE_KEY:-}
      VULTR_MODEL: ${VULTR_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      FORESIGHT_INFERENCE: ${FORESIGHT_INFERENCE:-}
      FORESIGHT_DEMO_SPEED: ${FORESIGHT_DEMO_SPEED:-30}
    volumes:
      - foresight-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  foresight-data:
  caddy-data:
  caddy-config:
